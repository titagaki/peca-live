version: '3.8'
services:
  app:
    build: .
    container_name: rails_app
    volumes:
      - .:/app
    expose:
      - "3000"
    environment:
      RAILS_ENV: development

  nginx:
    image: nginx:latest
    container_name: nginx_proxy
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
    depends_on:
      - app









